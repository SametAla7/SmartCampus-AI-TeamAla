services:
  backend:
    image: ${BACKEND_IMAGE:-smartcampus-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL_DIRECT:?DATABASE_URL_DIRECT must be set to the hosted Prisma URL}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://127.0.0.1:8000/api/auth/oauth/google/callback}
      CREATE_TABLES_ON_STARTUP: "true"
      DOCUMENT_STORAGE_PATH: /data/documents
    volumes:
      - document_data:/data/documents
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE:-smartcampus-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  document_data:



