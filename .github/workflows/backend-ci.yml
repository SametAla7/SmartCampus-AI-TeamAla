name: Backend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./ci-test.db
          JWT_SECRET: ci-only-secret
          SMARTCAMPUS_ALLOW_NON_REMOTE_DB: '1'
        run: python -m pytest -q
